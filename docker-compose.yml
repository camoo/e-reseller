services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reseller_framework_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=development
      - USE_REMOTE_CONFIG=false
      - CAMOO_HOSTING_ENDPOINT=http://host.docker.internal:8082/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - camoo-network

  https:
    image: caddy:2-alpine
    container_name: reseller_framework_https
    depends_on:
      - app
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
  camoo-network:
    name: camoo-network
    external: true
